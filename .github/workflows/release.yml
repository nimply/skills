name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the skill
        run: node scripts/check.mjs
      - name: Tag matches plugin version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match plugin.json $version"; exit 1; }
      - name: Build nimply.zip
        run: ./scripts/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/nimply.zip --title "$GITHUB_REF_NAME" --generate-notes
